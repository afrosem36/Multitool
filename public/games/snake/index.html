<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e2e8f0;
    overflow: hidden;
    touch-action: none;
  }
  #score-bar {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 0.75rem;
    font-size: 0.85rem;
    color: #64748b;
  }
  #score-bar span { color: #a5b4fc; font-weight: 700; font-size: 1rem; }
  canvas {
    border-radius: 12px;
    border: 1px solid rgba(99,102,241,0.25);
    box-shadow: 0 0 40px rgba(99,102,241,0.15);
    display: block;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    backdrop-filter: blur(4px);
  }
  #overlay h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(135deg,#6366f1,#a78bfa,#ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  #overlay p { color: #64748b; font-size: 0.875rem; }
  #overlay .final-score { font-size: 1.1rem; color: #a5b4fc; font-weight: 600; }
  #start-btn {
    background: linear-gradient(135deg,#6366f1,#8b5cf6);
    color: white;
    border: none;
    padding: 0.65rem 2rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: opacity 0.15s, transform 0.15s;
  }
  #start-btn:hover { opacity: 0.9; transform: scale(1.04); }
  #hint { margin-top: 0.5rem; font-size: 0.72rem; color: #334155; text-align: center; line-height: 1.6; }
</style>
</head>
<body>

<div id="score-bar">
  Score: <span id="score-val">0</span>
  &nbsp;|&nbsp;
  Best: <span id="best-val">0</span>
</div>
<canvas id="c"></canvas>

<div id="overlay">
  <h1>🐍 Snake</h1>
  <p id="overlay-sub">Classic snake — eat, grow, survive.</p>
  <p class="final-score" id="final-score" style="display:none"></p>
  <button id="start-btn">▶ Play</button>
  <p id="hint">Arrow keys / WASD to move<br>Swipe on mobile</p>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score-val');
  const bestEl = document.getElementById('best-val');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const overlaySub = document.getElementById('overlay-sub');
  const finalScore = document.getElementById('final-score');

  const CELL = 20;
  let cols, rows, snake, dir, nextDir, food, score, best, raf, running;

  function resize() {
    const vw = Math.min(window.innerWidth - 24, 480);
    const vh = Math.min(window.innerHeight - 80, 480);
    const size = Math.floor(Math.min(vw, vh) / CELL) * CELL;
    canvas.width = size;
    canvas.height = size;
    cols = size / CELL;
    rows = size / CELL;
  }

  function init() {
    const mid = Math.floor(cols / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    let f;
    do { f = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) }; }
    while (occupied.has(f.x + ',' + f.y));
    food = f;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background grid (subtle)
    ctx.fillStyle = '#0d0d16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= cols; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= rows; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
    }

    // Food — glowing dot
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, CELL * 0.55);
    grad.addColorStop(0, '#f87171');
    grad.addColorStop(1, 'rgba(239,68,68,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fca5a5';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // Snake
    snake.forEach((seg, i) => {
      const t = 1 - i / snake.length;
      const r = 99 + Math.round(t * 60);
      const g = 102 + Math.round(t * 20);
      const b = 241;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 1 : 2;
      roundRect(ctx, seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    });

    // Head eyes
    const h = snake[0];
    ctx.fillStyle = '#fff';
    const ex = h.x * CELL + (dir.x === 1 ? 14 : dir.x === -1 ? 4 : 7);
    const ey = h.y * CELL + (dir.y === 1 ? 14 : dir.y === -1 ? 4 : 7);
    ctx.beginPath(); ctx.arc(ex, ey, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a0a0f';
    ctx.beginPath(); ctx.arc(ex + dir.x, ey + dir.y, 1.2, 0, Math.PI * 2); ctx.fill();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  let lastTime = 0;
  const SPEED = 120; // ms per tick

  function loop(ts) {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    if (ts - lastTime < SPEED) return;
    lastTime = ts;

    dir = nextDir;
    const head = { x: (snake[0].x + dir.x + cols) % cols, y: (snake[0].y + dir.y + rows) % rows };

    // Self-collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver(); return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snakeBest', best); } catch(e){} }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(raf);
    overlaySub.textContent = 'Game Over!';
    finalScore.textContent = `Score: ${score}`;
    finalScore.style.display = '';
    startBtn.textContent = '↩ Play Again';
    overlay.style.display = 'flex';
  }

  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    overlaySub.textContent = 'Classic snake — eat, grow, survive.';
    finalScore.style.display = 'none';
    startBtn.textContent = '▶ Play';
    running = true;
    init();
    draw();
    lastTime = 0;
    raf = requestAnimationFrame(loop);
  });

  // Keyboard
  const DIRS = {
    ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
    w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0},
    W: {x:0,y:-1}, S: {x:0,y:1}, A: {x:-1,y:0}, D: {x:1,y:0},
  };
  document.addEventListener('keydown', e => {
    const d = DIRS[e.key];
    if (!d) return;
    if (d.x !== 0 && dir.x !== 0) return; // prevent 180
    if (d.y !== 0 && dir.y !== 0) return;
    nextDir = d;
    e.preventDefault();
  });

  // Swipe
  let tx0, ty0;
  document.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tx0 == null) return;
    const dx = e.changedTouches[0].clientX - tx0;
    const dy = e.changedTouches[0].clientY - ty0;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      const d = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
      if (d.x !== 0 && dir.x !== 0) return;
      nextDir = d;
    } else {
      const d = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
      if (d.y !== 0 && dir.y !== 0) return;
      nextDir = d;
    }
    tx0 = ty0 = null;
  }, { passive: true });

  window.addEventListener('resize', () => { resize(); if (!running) draw(); });

  try { best = parseInt(localStorage.getItem('snakeBest') || '0', 10) || 0; } catch(e) { best = 0; }
  bestEl.textContent = best;
  resize();
  draw();
})();
</script>
</body>
</html>
