name = "multi-tool-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "multitool_db"
database_name = "multitool-db"
database_id = "4a6dd45c-d5d2-4394-a960-fa2fa13c25c5"
migrations_dir = "migrations"

# R2 Storage
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "multitoolhub-files"

# Non-sensitive variables
[vars]
R2_BUCKET_NAME = "multitoolhub-files"
FRONTEND_URL = "https://www.multitoolhub.space"
SHORT_DOMAIN = "https://multi-tool-backend.multitoolhub-api.workers.dev"

# Secrets (set with: npx wrangler secret put KEY_NAME)
# JWT_SECRET
# GROQ_API_KEY  
# REMOVE_BG_API_KEY
# RESEND_API_KEY
# FROM_EMAIL
