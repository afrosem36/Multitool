name = "multi-tool-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ==========================================
# D1 Database
# ==========================================
[[d1_databases]]
binding = "multitool_db"
database_name = "multitool-db"
database_id = "4a6dd45c-d5d2-4394-a960-fa2fa13c25c5"
migrations_dir = "migrations"

# ==========================================
# R2 Storage
# ==========================================
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "multitoolhub-files"

# ==========================================
# Non-sensitive public vars (safe in toml)
# ==========================================
[vars]
R2_BUCKET_NAME = "multitoolhub-files"
FRONTEND_URL = "https://www.multitoolhub.space"
SHORT_DOMAIN = "https://multi-tool-backend.multitoolhub-api.workers.dev"

# ==========================================
# SECRETS — never put these in toml!
# Set each one via CLI:
#
#   wrangler secret put JWT_SECRET
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put REMOVE_BG_API_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put FROM_EMAIL
#
# ==========================================